[project]
name = "zotidy"
version = "0.1.0"
description = "Read-only diagnostics for a local Zotero library: duplicates, duplicate PDFs, missing files and identifiers."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zotidy = "zotidy.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotidy"]

[tool.ruff]
line-length = 100
